<title>GraFit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Idea: registro de gimnasio en móvil. Pestañas abajo, tarjetas por ejercicio, números grandes en condensada. */
:root{
  --bg:#E9F0EB; --surface:#FFFFFF; --ink:#0F1F17; --muted:#52665A; --line:#CFDDD3;
  --accent:#17603F; --accent-ink:#FFFFFF; --fail:#C23A22; --ok:#14804A; --soft:#DDEBE2; --hero1:#0C3E29; --hero2:#1C6B47;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A130E; --surface:#12201A; --ink:#E6F2EA; --muted:#8FA79A; --line:#22372C;
    --accent:#5BD39A; --accent-ink:#06140D; --fail:#FF8A73; --ok:#58C98E; --soft:#1A2D23; --hero1:#0D3A27; --hero2:#14573A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A130E; --surface:#12201A; --ink:#E6F2EA; --muted:#8FA79A; --line:#22372C;
  --accent:#5BD39A; --accent-ink:#06140D; --fail:#FF8A73; --ok:#58C98E; --soft:#1A2D23; --hero1:#0D3A27; --hero2:#14573A; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--body);-webkit-text-size-adjust:100%}
#app{max-width:720px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px 150px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.2px;margin:0;text-wrap:balance}
h1{font-size:30px} h2{font-size:24px} h3{font-size:20px}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin:0 0 12px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
label{display:block;font-size:13px;color:var(--muted);margin:0 0 4px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-height:42px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
textarea{min-height:56px;resize:vertical}
.btn{font:600 15px var(--body);background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px 14px;min-height:42px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--fail);border:1px solid var(--line)}
.btn.sm{min-height:34px;padding:6px 10px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:default}
.icon{background:transparent;border:0;color:var(--muted);font-size:20px;line-height:1;width:34px;height:34px;border-radius:8px;cursor:pointer}
.icon:hover{background:var(--soft)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--muted);white-space:nowrap}

<script>
/* Capa de datos para Google Apps Script: imita la base de datos que usaba la app y guarda en tu hoja. */
(function(){
  const run=(fn,...a)=>new Promise((res,rej)=>{
    if(window.google&&google.script&&google.script.run){
      google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej({code:(e&&e.message)||String(e)}))[fn](...a);return}
    let c=null;try{c=JSON.parse(localStorage.getItem("grafit_cfg")||"null")}catch(e){}
    if(!c||!c.url||!c.key){rej({code:"sin configurar"});return}
    fetch(c.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({key:c.key,fn:fn,args:a}),redirect:"follow"})
      .then(r=>r.json()).then(j=>j&&j.ok?res(j.r):rej({code:(j&&j.error)||"error"})).catch(e=>rej({code:(e&&e.message)||"sin red"}));
  });
  let docs=null,inflight=0,lastLoad=0,mirT=null;
  const docL={},colL={};
  const copy=o=>JSON.parse(JSON.stringify(o));
  const snapDoc=p=>({id:p.split("/").pop(),exists:!!docs[p],data:()=>copy(docs[p])});
  const snapCol=c=>({docs:Object.keys(docs).filter(k=>k.indexOf(c+"/")===0&&k.split("/").length===2).map(snapDoc)});
  function notify(p){
    (docL[p]||[]).forEach(f=>{try{f(snapDoc(p))}catch(e){}});
    const parts=p.split("/");if(parts.length===2)(colL[parts[0]]||[]).forEach(f=>{try{f(snapCol(parts[0]))}catch(e){}});
  }
  function mirror(){clearTimeout(mirT);mirT=setTimeout(()=>{run("api_reflejar").catch(()=>{})},5000)}
  async function load(){const r=await run("api_cargar");docs=JSON.parse(r);lastLoad=Date.now()}
  async function refresh(){
    if(inflight||!docs||Date.now()-lastLoad<20000)return;
    try{
      const old=docs;await load();
      const all={};Object.keys(old).concat(Object.keys(docs)).forEach(k=>all[k]=1);
      Object.keys(all).forEach(p=>{if(JSON.stringify(old[p])!==JSON.stringify(docs[p]))notify(p)});
    }catch(e){}
  }
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")refresh()});
  const db={
    doc:p=>({
      set:async d=>{inflight++;try{await run("api_guardar",p,JSON.stringify(d));docs[p]=copy(d);notify(p);mirror()}finally{inflight--}},
      delete:async()=>{inflight++;try{await run("api_borrar",p);delete docs[p];notify(p);mirror()}finally{inflight--}},
      onSnapshot:(cb,err)=>{(docL[p]=docL[p]||[]).push(cb);if(docs)cb(snapDoc(p))}
    }),
    collection:c=>({onSnapshot:(cb,err)=>{(colL[c]=colL[c]||[]).push(cb);if(docs)cb(snapCol(c))}})
  };
  const files={save:async o=>{
    const blob=o.data instanceof Blob?o.data:new Blob([o.data],{type:"text/csv"});
    try{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=o.filename;document.body.appendChild(a);a.click();a.remove()}catch(e){}
    const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]||"");r.onerror=rej;r.readAsDataURL(blob)});
    await run("api_guardarArchivo",o.filename,blob.type,b64);
    document.dispatchEvent(new CustomEvent("filesaved"));
  }};
  let ready=null;
  window.claude={use:async n=>{
    if(n==="db"){if(!ready)ready=load().then(()=>db);return ready}
    if(n==="downloads")return files;
    return null;
  }};
})();
</script>
<script>
"use strict";
const GR=["Pectoral","Espalda","Trapecio","Deltoides ant.","Deltoides lat.","Deltoides post.","Tríceps","Bíceps","Antebrazo","CORE","Glúteo","Femoral","Cuadríceps","Gemelo"];
const MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const TABS_E=[["entrenar","Entrenar"],["rutinas","Rutinas"],["series","Volumen"],["progreso","Intensidad"],["calendario","Calendario"],["datos","Datos"]];
const TABS_S=[["resumen","Resumen"],["medidas","Medidas"],["cintura","Mejores marcas"],["datos","Datos"]];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3);
const fnum=x=>{if(x==null||x==="")return "";return String(Math.round(x*10)/10).replace(".",",")};
const toNum=v=>{const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:null};
function pdate(d){const a=d.split("-").map(Number);return new Date(Date.UTC(a[0],a[1]-1,a[2]))}
function iso(t){return t.toISOString().slice(0,10)}
function today(){const n=new Date();return n.getFullYear()+"-"+pad(n.getMonth()+1)+"-"+pad(n.getDate())}
function monday(d){const t=pdate(d);t.setUTCDate(t.getUTCDate()-((t.getUTCDay()+6)%7));return iso(t)}
function addDays(d,n){const t=pdate(d);t.setUTCDate(t.getUTCDate()+n);return iso(t)}
function fdate(d){const t=pdate(d);return t.getUTCDate()+" "+MES[t.getUTCMonth()]+(t.getUTCFullYear()!==new Date().getFullYear()?" "+String(t.getUTCFullYear()).slice(2):"")}
function daysSince(d){return Math.floor((pdate(today())-pdate(d))/864e5)}

const S={db:null,err:null,tab:"entrenar",cat:[],catMap:{},rut:[],cfg:{sec:"principal",copia:null},hist:{},padelList:[],medidas:[],mf:{},mShown:25,mYear:null,sec:"entreno",lastTab:{entreno:"entrenar",seguim:"resumen"},sessions:[],byEx:{},
  draft:null,draftReady:false,calMonth:null,calSel:null,calView:"cal",sView:"sem",sGrp:"",sMode:"mes",gMode:"sem",gMet:"n",gType:"all",padel:{date:"",h:""},loaded:{},pick:{r:"",d:"",date:""},openR:{},showCat:false,catQ:"",progEx:"",progAll:false,weeks:12,saved:null,busy:""};

/* ---------- datos ---------- */
function rebuild(){
  S.catMap={};S.cat.forEach(c=>S.catMap[c.id]=c);
  const all=[];Object.keys(S.hist).sort().forEach(k=>(S.hist[k].ses||[]).forEach(x=>all.push(x)));
  (S.padelList||[]).forEach(x=>all.push(x));
  all.sort((a,b)=>a.f<b.f?-1:a.f>b.f?1:(a.id<b.id?-1:1));
  S.sessions=all;S.byEx={};
  all.forEach(se=>se.ej.forEach(en=>{(S.byEx[en.e]=S.byEx[en.e]||[]).push({f:se.f,id:se.id,s:en.s,n:en.n,dia:se.dia})}));
}
function countInto(row,en){
  const c=S.catMap[en.e];if(!c||!c.g)return;const n=en.s.length,m=S.cfg.sec||"principal";
  row[c.g]=(row[c.g]||0)+n;
  if(c.g2){if(m==="mitad")row[c.g2]=(row[c.g2]||0)+n*.5;else if(m==="ambos")row[c.g2]=(row[c.g2]||0)+n}
}

const epley=(p,r)=>(p>0&&r>0&&r<=12)?p*(1+r/30):null;

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let wchain=Promise.resolve();
async function attempt(path,data,t){
  try{await Promise.race([S.db.doc(path).set(data),sleep(20000).then(()=>{throw {code:"tiempo agotado"}})]);await sleep(450);return true}
  catch(e){
    if(t<5){await sleep(1500*(t+1));return attempt(path,data,t+1)}
    S.lastErr=(e&&(e.code||e.message))||"error";toast("No se pudo guardar ("+S.lastErr+"). Inténtalo de nuevo.",true);return false;
  }
}
function wr(path,data){const p=wchain.then(()=>attempt(path,data,0));wchain=p.catch(()=>{});return p}
function saveCat(){return wr("fuerza/catalogo",{items:S.cat})}

function parseHours(v){
  v=String(v==null?"":v).trim().toLowerCase().replace(",",".");if(!v)return null;
  let m=v.match(/^(\d+):(\d{1,2})$/);if(m)return +m[1]+(+m[2])/60;
  m=v.match(/^(\d+(?:\.\d+)?)\s*(?:h|hr|hrs|hora|horas)\s*(?:y\s*)?(?:(\d+)\s*(?:m|min|mins|minuto|minutos)?)?$/);if(m)return +m[1]+(m[2]?+m[2]/60:0);
  m=v.match(/^(\d+(?:\.\d+)?)\s*(?:h|hora|horas)?\s*y\s*media$/);if(m)return +m[1]+.5;
  m=v.match(/^(\d+(?:\.\d+)?)\s*(?:m|min|mins|minuto|minutos)$/);if(m)return +m[1]/60;
  m=v.match(/^\d+(?:\.\d+)?$/);if(m){const n=+v;return n>12?n/60:n}
  return null;
}
function padelPrev(v){

}

function avgBuckets(grp,mode){
  const td=today(),first=S.sessions.length?S.sessions[0].f:td,tot={};
  const key=f=>mode==="anio"?f.slice(0,4):f.slice(0,7);
  S.sessions.forEach(se=>{const row={};se.ej.forEach(en=>countInto(row,en));
    const v=grp?(row[grp]||0):Object.values(row).reduce((x,y)=>x+y,0);tot[key(se.f)]=(tot[key(se.f)]||0)+v});
  const list=[];
  if(mode==="anio"){for(let y=+first.slice(0,4);y<=+td.slice(0,4);y++)list.push({k:String(y),s:y+"-01-01",e:y+"-12-31",l:String(y)})}
  else{let y=+td.slice(0,4),m=+td.slice(5,7);for(let i=0;i<12;i++){const k=y+"-"+pad(m),last=new Date(Date.UTC(y,m,0)).getUTCDate();list.unshift({k:k,s:k+"-01",e:k+"-"+pad(last),l:MESC[m-1]});m--;if(m<1){m=12;y--}}}
  return list.map(p=>{const st=p.s<first?first:p.s,en=p.e>td?td:p.e;
    const days=Math.max(7,Math.round((pdate(en)-pdate(st))/864e5)+1);
    return {l:p.l,v:Math.round((tot[p.k]||0)/(days/7)*10)/10}});
}

const MESC=MES.map(m=>m[0].toUpperCase()+m.slice(1));
function lineChart(pts,k1,k2,unit,mode){
  const W=340,H=236,L=42,R=18,T=24,B=34;
  let xs=pts.map(p=>pdate(p.f).getTime()),x0=Math.min(...xs),x1=Math.max(...xs);
  if(x1===x0){x0-=15*864e5;x1+=15*864e5}
  const vals=[];pts.forEach(p=>{if(p[k1]!=null)vals.push(p[k1]);if(k2&&p[k2]!=null)vals.push(p[k2])});
  let ymax=Math.max(...vals,1),ymin=Math.min(...vals);
  const step=ymax>200?50:ymax>100?20:ymax>40?10:ymax>15?5:2;
  ymax=Math.ceil(ymax/step)*step;ymin=Math.max(0,Math.floor(ymin*0.85/step)*step);if(ymin>=ymax)ymin=Math.max(0,ymax-step);
  const P=16,X=t=>L+P+(t-x0)/(x1-x0)*(W-L-R-2*P),Y=v=>T+(1-(v-ymin)/(ymax-ymin))*(H-T-B);
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Evolución en el tiempo">';
  for(let v=ymin;v<=ymax;v+=step)s+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text x="'+(L-5)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+v+'</text>';
  const span=(x1-x0)/864e5;
  if(mode==="anio"||mode==="mes12"||mode==="sem"){pts.forEach(p=>{const d=pdate(p.f);const t=mode==="anio"?p.f.slice(0,4):mode==="mes12"?MESC[d.getUTCMonth()]:d.getUTCDate()+" "+MESC[d.getUTCMonth()];s+='<text x="'+X(d.getTime()).toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle">'+t+'</text>'})}
  else if(span>700){const y0=new Date(x0).getUTCFullYear(),y1=new Date(x1).getUTCFullYear();
    for(let y=y0;y<=y1+1;y++){const t=Date.UTC(y,0,1);if(t<x0-30*864e5||t>x1+30*864e5)continue;const x=X(Math.max(x0,Math.min(x1,t)));s+='<line class="grid" x1="'+x+'" x2="'+x+'" y1="'+T+'" y2="'+(H-B)+'" style="opacity:.5"/><text x="'+(x+3)+'" y="'+(H-10)+'">'+y+'</text>'}}
  else{const n=Math.min(6,Math.max(2,Math.round(span/30)));for(let i=0;i<=n;i++){const t=x0+(x1-x0)*i/n,d=new Date(t);s+='<text x="'+X(t).toFixed(1)+'" y="'+(H-10)+'" text-anchor="'+(i===0?"start":i===n?"end":"middle")+'">'+d.getUTCDate()+" "+MESC[d.getUTCMonth()]+'</text>'}}
  const line=(k,c)=>{const q=pts.filter(p=>p[k]!=null);if(!q.length)return "";
    return '<path class="'+c+'" d="'+q.map((p,i)=>(i?"L":"M")+X(pdate(p.f).getTime()).toFixed(1)+" "+Y(p[k]).toFixed(1)).join(" ")+'"/>'+q.map(p=>'<circle class="d'+c.slice(1)+'" cx="'+X(pdate(p.f).getTime()).toFixed(1)+'" cy="'+Y(p[k]).toFixed(1)+'" r="'+(c==="l1"?3.5:2.2)+'"/>').join("")};
  if(k2)s+=line(k2,"l2");s+=line(k1,"l1");
  const lab=pts.length<=14?pts:[pts[pts.length-1]];
  lab.forEach(p=>{if(p[k1]!=null)s+='<text x="'+X(pdate(p.f).getTime()).toFixed(1)+'" y="'+(Y(p[k1])-9).toFixed(1)+'" text-anchor="middle" style="fill:var(--ink);font-weight:600">'+fnum(p[k1])+'</text>'});
  return s+'</svg>';
}
function bucketPts(pts,mode){
  let src=pts;
  if(mode==="sem")src=pts.filter(p=>p.f>=addDays(today(),-31));
  else if(mode==="mes12")src=pts.filter(p=>p.f>=addDays(today(),-365));
  const m={};src.forEach(p=>{
    let k,f;
    if(mode==="anio"){k=p.f.slice(0,4);f=k+"-07-01"}
    else if(mode==="mes12"){k=p.f.slice(0,7);f=k+"-15"}
    else{k=monday(p.f);f=k}
    const b=m[k]||(m[k]={f:f,top:null,rm:null,rep:null});
    ["top","rm","rep"].forEach(q=>{if(p[q]!=null&&(b[q]==null||p[q]>b[q]))b[q]=p[q]})});
  return Object.keys(m).sort().map(k=>m[k]);
}

function barChart(items,cl){

function dualChart(data,labels){

function xDate(v){

  if(typeof v==="number")return iso(new Date(Math.round((v-25569)*864e5)));
  const s=String(v).trim();let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[1]+"-"+m[2]+"-"+m[3];
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m)return m[3]+"-"+pad(+m[2])+"-"+pad(+m[1]);return null;
}

  S.cat=cat;
  const rts=sh("Rutinas");
  if(rts){const m={};rts.forEach(r=>{if(!r["Rutina"]||!r["Día"])return;const ru=m[r["Rutina"]]||(m[r["Rutina"]]={id:"r"+uid(),n:String(r["Rutina"]),dias:[]});const es=ESTADOS.find(x=>x[1]===r["Estado"]);if(es)ru.est=es[0];
    let d=ru.dias.find(x=>x.n===r["Día"]);if(!d){d={id:"d"+uid(),n:String(r["Día"]),ej:[]};ru.dias.push(d)}
    if(r["Ejercicio"]){const c=get(r["Ejercicio"]);d.ej.push(c.id)}});S.rut=Object.values(m)}
  S.cat=cat;rebuild();
  S.busy="Guardando…";render();
  if(med&&med.length&&("Peso (kg)" in med[0])){S.medidas=medFromSheet(med);await medWr()}
  await saveCat();await saveRut();if(pds)await wr("fuerza/padel",{items:S.padelList});
  for(const k of Object.keys(S.hist))await putMonth(k);
  for(const k of oldKeys)if(!S.hist[k])await S.db.doc("hist/"+k).delete().catch(()=>{});
  S.busy="";toast("Datos restaurados");render();
}
async function doSeed(){
  S.busy="Cargando…";render();
  try{
    const r=await fetch("seed.json");const d=await r.json();
    S.cat=d.catalogo;const by={};
    d.sesiones.forEach(se=>{const k=se.f.slice(0,4);(by[k]||(by[k]={m:k,ses:[]})).ses.push(se)});
    S.hist=by;rebuild();if(!await saveCat())throw new Error("cat");
    const ks=Object.keys(by);let i=0;
    for(const k of ks){i++;S.busy="Guardando "+i+" de "+ks.length+"…";render();if(!await putMonth(k))throw new Error("hist")}
    S.cfg=Object.assign({sec:"principal",copia:null},S.cfg,{seed:true});await saveCfg();
    S.busy="";toast("Histórico cargado");
  }catch(e){S.busy="";toast("No se pudo cargar el histórico ("+(S.lastErr||e.message)+"). Pulsa de nuevo para reintentar.",true)}
  render();
}

document.addEventListener("input",e=>{
  const t=e.target,f=t.dataset&&t.dataset.f;if(!f)return;
  if(f==="p"||f==="r"){const s=S.draft.ej[+t.dataset.i].s[+t.dataset.j];s[f]=t.value;saveDraft();if(f==="r")refreshCount()}
  else if(f==="n"){S.draft.ej[+t.dataset.i].n=t.value;saveDraft()}
  else if(f.indexOf("mf-")===0){S.mf[f.slice(3)]=t.value}
  else if(f==="padel-h"){S.padel.h=t.value;const pv=$("#phv");if(pv)pv.textContent=padelPrev(t.value)}
  else if(f==="catq"){S.catQ=t.value;$("#catlist").innerHTML=catList()}
});
document.addEventListener("change",e=>{
  const t=e.target,f=t.dataset&&t.dataset.f;if(!f)return;
  if(f==="pick-r"){S.pick.r=t.value;S.pick.d="";render()}
  else if(f==="pick-d"){S.pick.d=t.value;render()}
  else if(f==="pick-date"){S.pick.date=t.value}
  else if(f==="padel-date"){S.padel.date=t.value}
  else if(f==="sgrp"){S.sGrp=t.value;render()}
  else if(f==="progex"){S.progEx=t.value;render()}
  else if(f==="import"){doImport(t.files&&t.files[0]);t.value=""}
});

/* ---------- arranque ---------- */
(async function(){
  render();
  let db=null;try{db=await claude.use("db")}catch(e){}
  if(!db){S.err="nodb";render();return}
  S.db=db;
  const bad=()=>{S.loaded.err=true};
  const lt=setTimeout(()=>{if(!(S.loaded.cat&&S.loaded.hist&&S.loaded.rut)){const a=$("#app");a.insertAdjacentHTML("afterbegin",'<div class="banner warn">Tus datos tardan en llegar. Puede que lo que ves no esté al día.</div>')}},10000);
  db.doc("fuerza/catalogo").onSnapshot(s=>{S.cat=s.exists?(s.data().items||[]):[];S.loaded.cat=true;rebuild();soft()},bad);
  db.doc("fuerza/padel").onSnapshot(s=>{if(S.padelPend>0)return;S.padelList=s.exists?(s.data().items||[]):[];S.loaded.pd=true;rebuild();soft()},bad);
  db.doc("fuerza/medidas").onSnapshot(s=>{if(S.medPend>0)return;S.medidas=s.exists?(s.data().items||[]):[];S.medidas.forEach((r,i)=>{if(!r.id)r.id="m"+i+r.f});S.loaded.med=true;soft()},bad);
  db.doc("fuerza/rutinas").onSnapshot(s=>{S.rut=s.exists?(s.data().items||[]):[];S.loaded.rut=true;soft()},bad);
  db.doc("fuerza/config").onSnapshot(s=>{if(s.exists)S.cfg=Object.assign({sec:"principal",copia:null},s.data());S.loaded.cfg=true;soft()},bad);
  db.doc("fuerza/borrador").onSnapshot(s=>{if(!S.draftReady){S.draftReady=true;const d=s.exists?s.data().d:null;if(d)S.draft=d;S.loaded.dr=true;render()}},bad);
  db.collection("hist").onSnapshot(q=>{const h={};q.docs.forEach(d=>h[d.id]=decDoc(d.data()));S.hist=h;S.loaded.hist=true;rebuild();soft();clearTimeout(lt)},bad);
})();
