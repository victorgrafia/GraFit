<title>GraFit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Idea: registro de gimnasio en móvil. Pestañas abajo, tarjetas por ejercicio, números grandes en condensada. */
:root{
  --bg:#E9F0EB; --surface:#FFFFFF; --ink:#0F1F17; --muted:#52665A; --line:#CFDDD3;
  --accent:#17603F; --accent-ink:#FFFFFF; --fail:#C23A22; --ok:#14804A; --soft:#DDEBE2; --hero1:#0C3E29; --hero2:#1C6B47;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A130E; --surface:#12201A; --ink:#E6F2EA; --muted:#8FA79A; --line:#22372C;
    --accent:#5BD39A; --accent-ink:#06140D; --fail:#FF8A73; --ok:#58C98E; --soft:#1A2D23; --hero1:#0D3A27; --hero2:#14573A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A130E; --surface:#12201A; --ink:#E6F2EA; --muted:#8FA79A; --line:#22372C;
  --accent:#5BD39A; --accent-ink:#06140D; --fail:#FF8A73; --ok:#58C98E; --soft:#1A2D23; --hero1:#0D3A27; --hero2:#14573A; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--body);-webkit-text-size-adjust:100%}
#app{max-width:720px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px 150px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.2px;margin:0;text-wrap:balance}
h1{font-size:30px} h2{font-size:24px} h3{font-size:20px}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin:0 0 12px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
label{display:block;font-size:13px;color:var(--muted);margin:0 0 4px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-height:42px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
textarea{min-height:56px;resize:vertical}
.btn{font:600 15px var(--body);background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px 14px;min-height:42px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--fail);border:1px solid var(--line)}
.btn.sm{min-height:34px;padding:6px 10px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:default}
.icon{background:transparent;border:0;color:var(--muted);font-size:20px;line-height:1;width:34px;height:34px;border-radius:8px;cursor:pointer}
.icon:hover{background:var(--soft)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--muted);white-space:nowrap}
.banner{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 12px;font-size:14px}
.banner.warn{border-color:var(--fail)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:calc(env(safe-area-inset-bottom) + 14px);box-shadow:0 -4px 14px rgba(0,0,0,.08)}
.tabs .in{display:flex;width:100%;max-width:720px}
.tabs button{flex:1;background:transparent;border:0;color:var(--muted);font:700 12px var(--body);padding:20px 0 18px;min-height:60px;cursor:pointer;border-top:3px solid transparent}
.tabs button[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}
.hd{display:flex;justify-content:space-between;align-items:center;margin:6px 0 14px;gap:10px;padding:16px;border-radius:14px;color:#fff;background:linear-gradient(135deg,var(--hero1),var(--hero2));position:relative;overflow:hidden}
.hd h1{color:#fff;text-transform:uppercase;letter-spacing:1px}.hd .muted{color:#BFE0CE}.hd .chip{background:rgba(255,255,255,.18);color:#fff}
.hd .btn{background:#fff;color:#0C3E29}
.hd svg.deco{flex:none;opacity:.95}
.hd::after{content:"";position:absolute;right:-30px;top:-40px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.06);pointer-events:none}
/* ejercicio en el entreno */
.ex h3{font-size:21px}
.last{font-size:13px;color:var(--muted);margin:6px 0 8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:16px 58px 48px auto 22px;gap:6px;align-items:center}
.set .n{font:700 15px var(--display);color:var(--muted);text-align:center}
.set input{text-align:center;padding:6px 2px;min-height:40px;font-size:16px;font-variant-numeric:tabular-nums}
.rir{display:flex;gap:2px}
@media (prefers-color-scheme:dark){.chip.st-0{background:#1E4A33;color:#9FE3BD}}
.rir button{width:25px;height:40px;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:6px;font:700 14px var(--display);cursor:pointer;padding:0}
.rir button.on{color:#16200F;border-color:transparent}
.rir button.on.cf{background:#C23A22;color:#fff}
.rir button.on.c0{background:#14804A;color:#fff}
.rir button.on.c1{background:#5FB15E}
.rir button.on.c2{background:#A8CF5A}
.rir button.on.c3{background:#F0D14A}
.rir button.on.c4{background:#F5E58C}
.chip.st-f{background:#C23A22;color:#fff}
.chip.st-0{background:#CFE8D8;color:#0E5A31}
.sess-t{background:var(--soft);border-left:4px solid var(--accent);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.set .x{width:22px;height:34px;padding:0;font-size:18px}
.legend{display:grid;grid-template-columns:16px 58px 48px auto;gap:6px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;text-align:center;margin-bottom:2px}
/* barras de series */
.bar{display:grid;grid-template-columns:104px 1fr 34px;gap:8px;align-items:center;padding:4px 0}
.bar .t{height:14px;background:var(--soft);border-radius:4px;overflow:hidden;position:relative}
.bar .t i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar b{font:700 18px var(--display);text-align:right;font-variant-numeric:tabular-nums}
.bar span.l{font-size:14px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:6px 7px;text-align:center;white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:12px}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
tbody tr+tr td{border-top:1px solid var(--line)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:0 0 12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tile b{display:block;font:700 28px var(--display);line-height:1.1}
.tile span{font-size:12px;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;background:var(--bg);border:0;color:var(--muted);font:600 13px var(--body);padding:9px 6px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.li{display:flex;align-items:center;gap:6px;padding:8px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.sess{padding:10px 0;border-top:1px solid var(--line)}
.sess:first-child{border-top:0}
.sets-txt{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.pr{background:#F5C518;color:#3B2A00}
.top1{border-left:4px solid #F5C518}
svg text{fill:var(--muted);font:10.5px var(--body)}
svg .grid{stroke:var(--line);stroke-width:1}
svg .l1{fill:none;stroke:var(--accent);stroke-width:2.5}
svg .l2{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 3}
svg .d1{fill:var(--accent)} svg .d2{fill:var(--muted)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:14px;z-index:30;max-width:90%}
#toast[hidden]{display:none}
#modal[hidden]{display:none}
.scrim{position:fixed;inset:0;background:rgba(8,14,20,.55);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:720px;margin:0 auto;max-height:86%;overflow:auto;background:var(--surface);border-radius:14px 14px 0 0;padding:16px;z-index:21;display:flex;flex-direction:column;gap:10px}

.day.sel{box-shadow:0 0 0 2px var(--ink)}
.day.blank{visibility:hidden}

.est-proxima{background:#1F5FD0!important;color:#fff!important}
.est-no{background:#C23A22!important;color:#fff!important}
svg .bar1{fill:var(--accent)} svg .bar0{fill:var(--accent);opacity:.55}

.sess-t.pd{border-left-color:var(--padel)}
.tile.pd{border-color:var(--padel)}
.tile.gr{border-color:var(--accent)}

.dot{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}

<div id="app"><div class="empty">Cargando tu diario…</div></div>
<nav class="tabs" aria-label="Secciones"><div class="in" id="tabs"></div></nav>
<div id="modal" hidden></div>
<div id="toast" hidden role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* Capa de datos para Google Apps Script: imita la base de datos que usaba la app y guarda en tu hoja. */
(function(){
  const run=(fn,...a)=>new Promise((res,rej)=>{
    if(window.google&&google.script&&google.script.run){
      google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej({code:(e&&e.message)||String(e)}))[fn](...a);return}
    let c=null;try{c=JSON.parse(localStorage.getItem("grafit_cfg")||"null")}catch(e){}
    if(!c||!c.url||!c.key){rej({code:"sin configurar"});return}
    fetch(c.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({key:c.key,fn:fn,args:a}),redirect:"follow"})
      .then(r=>r.json()).then(j=>j&&j.ok?res(j.r):rej({code:(j&&j.error)||"error"})).catch(e=>rej({code:(e&&e.message)||"sin red"}));
  });
  let docs=null,inflight=0,lastLoad=0,mirT=null;
  const docL={},colL={};
  const copy=o=>JSON.parse(JSON.stringify(o));
  const snapDoc=p=>({id:p.split("/").pop(),exists:!!docs[p],data:()=>copy(docs[p])});
  const snapCol=c=>({docs:Object.keys(docs).filter(k=>k.indexOf(c+"/")===0&&k.split("/").length===2).map(snapDoc)});
  function notify(p){
    (docL[p]||[]).forEach(f=>{try{f(snapDoc(p))}catch(e){}});
    const parts=p.split("/");if(parts.length===2)(colL[parts[0]]||[]).forEach(f=>{try{f(snapCol(parts[0]))}catch(e){}});
  }
  function mirror(){clearTimeout(mirT);mirT=setTimeout(()=>{run("api_reflejar").catch(()=>{})},5000)}
  async function load(){const r=await run("api_cargar");docs=JSON.parse(r);lastLoad=Date.now()}
  async function refresh(){
    if(inflight||!docs||Date.now()-lastLoad<20000)return;
    try{
      const old=docs;await load();
      const all={};Object.keys(old).concat(Object.keys(docs)).forEach(k=>all[k]=1);
      Object.keys(all).forEach(p=>{if(JSON.stringify(old[p])!==JSON.stringify(docs[p]))notify(p)});
    }catch(e){}
  }
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")refresh()});
  const db={
    doc:p=>({
      set:async d=>{inflight++;try{await run("api_guardar",p,JSON.stringify(d));docs[p]=copy(d);notify(p);mirror()}finally{inflight--}},
      delete:async()=>{inflight++;try{await run("api_borrar",p);delete docs[p];notify(p);mirror()}finally{inflight--}},
      onSnapshot:(cb,err)=>{(docL[p]=docL[p]||[]).push(cb);if(docs)cb(snapDoc(p))}
    }),
    collection:c=>({onSnapshot:(cb,err)=>{(colL[c]=colL[c]||[]).push(cb);if(docs)cb(snapCol(c))}})
  };
  const files={save:async o=>{
    const blob=o.data instanceof Blob?o.data:new Blob([o.data],{type:"text/csv"});
    try{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=o.filename;document.body.appendChild(a);a.click();a.remove()}catch(e){}
    const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]||"");r.onerror=rej;r.readAsDataURL(blob)});
    await run("api_guardarArchivo",o.filename,blob.type,b64);
    document.dispatchEvent(new CustomEvent("filesaved"));
  }};
  let ready=null;
  window.claude={use:async n=>{
    if(n==="db"){if(!ready)ready=load().then(()=>db);return ready}
    if(n==="downloads")return files;
    return null;
  }};
})();
</script>
<script>
"use strict";
const GR=["Pectoral","Espalda","Trapecio","Deltoides ant.","Deltoides lat.","Deltoides post.","Tríceps","Bíceps","Antebrazo","CORE","Glúteo","Femoral","Cuadríceps","Gemelo"];
const MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const TABS_E=[["entrenar","Entrenar"],["rutinas","Rutinas"],["series","Volumen"],["progreso","Intensidad"],["calendario","Calendario"],["datos","Datos"]];
const TABS_S=[["resumen","Resumen"],["medidas","Medidas"],["cintura","Mejores marcas"],["datos","Datos"]];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3);
const fnum=x=>{if(x==null||x==="")return "";return String(Math.round(x*10)/10).replace(".",",")};
const toNum=v=>{const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:null};
function pdate(d){const a=d.split("-").map(Number);return new Date(Date.UTC(a[0],a[1]-1,a[2]))}
function iso(t){return t.toISOString().slice(0,10)}
function today(){const n=new Date();return n.getFullYear()+"-"+pad(n.getMonth()+1)+"-"+pad(n.getDate())}
function monday(d){const t=pdate(d);t.setUTCDate(t.getUTCDate()-((t.getUTCDay()+6)%7));return iso(t)}
function addDays(d,n){const t=pdate(d);t.setUTCDate(t.getUTCDate()+n);return iso(t)}
function fdate(d){const t=pdate(d);return t.getUTCDate()+" "+MES[t.getUTCMonth()]+(t.getUTCFullYear()!==new Date().getFullYear()?" "+String(t.getUTCFullYear()).slice(2):"")}
function daysSince(d){return Math.floor((pdate(today())-pdate(d))/864e5)}

const S={db:null,err:null,tab:"entrenar",cat:[],catMap:{},rut:[],cfg:{sec:"principal",copia:null},hist:{},padelList:[],medidas:[],mf:{},mShown:25,mYear:null,sec:"entreno",lastTab:{entreno:"entrenar",seguim:"resumen"},sessions:[],byEx:{},
  draft:null,draftReady:false,calMonth:null,calSel:null,calView:"cal",sView:"sem",sGrp:"",sMode:"mes",gMode:"sem",gMet:"n",gType:"all",padel:{date:"",h:""},loaded:{},pick:{r:"",d:"",date:""},openR:{},showCat:false,catQ:"",progEx:"",progAll:false,weeks:12,saved:null,busy:""};

/* ---------- datos ---------- */
function rebuild(){
  S.catMap={};S.cat.forEach(c=>S.catMap[c.id]=c);
  const all=[];Object.keys(S.hist).sort().forEach(k=>(S.hist[k].ses||[]).forEach(x=>all.push(x)));
  (S.padelList||[]).forEach(x=>all.push(x));
  all.sort((a,b)=>a.f<b.f?-1:a.f>b.f?1:(a.id<b.id?-1:1));
  S.sessions=all;S.byEx={};
  all.forEach(se=>se.ej.forEach(en=>{(S.byEx[en.e]=S.byEx[en.e]||[]).push({f:se.f,id:se.id,s:en.s,n:en.n,dia:se.dia})}));
}
function countInto(row,en){
  const c=S.catMap[en.e];if(!c||!c.g)return;const n=en.s.length,m=S.cfg.sec||"principal";
  row[c.g]=(row[c.g]||0)+n;
  if(c.g2){if(m==="mitad")row[c.g2]=(row[c.g2]||0)+n*.5;else if(m==="ambos")row[c.g2]=(row[c.g2]||0)+n}
}
function weekly(){const W={};S.sessions.forEach(se=>{const k=monday(se.f);const row=W[k]||(W[k]={});se.ej.forEach(en=>countInto(row,en))});return W}
const epley=(p,r)=>(p>0&&r>0&&r<=12)?p*(1+r/30):null;
function lastOf(e){const a=S.byEx[e];return a&&a.length?a[a.length-1]:null}
function setTxt(s){const p=s[0],r=s[1],q=s[2];return (p?fnum(p):"PC")+"×"+(r==null?"–":r)+(q===-1?" F":q!=null?" @"+q:"")}
function setChip(s){return '<span class="chip'+(s[2]===-1?" st-f":s[2]===0?" st-0":"")+'">'+esc(setTxt(s))+'</span>'}

/* ---------- escritura ---------- */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let wchain=Promise.resolve();
async function attempt(path,data,t){
  try{await Promise.race([S.db.doc(path).set(data),sleep(20000).then(()=>{throw {code:"tiempo agotado"}})]);await sleep(450);return true}
  catch(e){
    if(t<5){await sleep(1500*(t+1));return attempt(path,data,t+1)}
    S.lastErr=(e&&(e.code||e.message))||"error";toast("No se pudo guardar ("+S.lastErr+"). Inténtalo de nuevo.",true);return false;
  }
}
function wr(path,data){const p=wchain.then(()=>attempt(path,data,0));wchain=p.catch(()=>{});return p}
function saveCat(){return wr("fuerza/catalogo",{items:S.cat})}
function saveRut(){return wr("fuerza/rutinas",{items:S.rut})}
function saveCfg(){return wr("fuerza/config",S.cfg)}
let dT=null;
let dFly=false,dDirty=false;
function flushDraft(){if(dFly){dDirty=true;return}dFly=true;wr("fuerza/borrador",{d:S.draft||null}).finally(()=>{dFly=false;if(dDirty){dDirty=false;flushDraft()}})}
function saveDraft(){clearTimeout(dT);dT=setTimeout(flushDraft,700)}
function encDoc(doc){return {m:doc.m,ses:(doc.ses||[]).map(se=>Object.assign({},se,{ej:(se.ej||[]).map(en=>Object.assign({},en,{s:en.s.map(x=>Array.isArray(x)?{p:x[0]==null?0:x[0],r:x[1]==null?null:x[1],q:x[2]==null?null:x[2]}:x)}))}))}}
function decDoc(d){const o=Object.assign({},d);o.ses=(d.ses||[]).map(se=>Object.assign({},se,{ej:(se.ej||[]).map(en=>Object.assign({},en,{s:(en.s||[]).map(x=>Array.isArray(x)?x:[x.p==null?0:x.p,x.r==null?null:x.r,x.q==null?null:x.q])}))}));return o}
function putMonth(k){return wr("hist/"+k,encDoc(S.hist[k]))}
function saveSession(se){
  const k=se.f.slice(0,4);const doc=S.hist[k]||{m:k,ses:[]};
  doc.ses=doc.ses.filter(x=>x.id!==se.id);doc.ses.push(se);S.hist[k]=doc;rebuild();return putMonth(k);
}

/* ---------- interfaz base ---------- */
let tT=null;
function toast(msg,bad){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(tT);tT=setTimeout(()=>t.hidden=true,bad?4500:2600)}
function modal(html,mount){const m=$("#modal");m.innerHTML='<div class="scrim" data-a="mclose"></div><div class="sheet" role="dialog" aria-modal="true">'+html+'</div>';m.hidden=false;if(mount)mount(m)}
function mclose(){const m=$("#modal");m.hidden=true;m.innerHTML=""}
function askText(title,label,val,ok){return new Promise(res=>{
  modal('<h3>'+esc(title)+'</h3><div><label for="mt">'+esc(label)+'</label><input id="mt" type="text" autocomplete="off" value="'+esc(val||"")+'"></div><div class="row"><button class="btn ghost grow" id="mc">Cancelar</button><button class="btn grow" id="mok">'+esc(ok||"Guardar")+'</button></div>',()=>{
    const i=$("#mt");i.focus();i.select();
    const done=v=>{mclose();res(v)};
    $("#mc").onclick=()=>done(null);$("#mok").onclick=()=>done(i.value.trim()||null);
    i.onkeydown=e=>{if(e.key==="Enter")done(i.value.trim()||null)};
  })})}
function askOk(title,msg,ok,danger){return new Promise(res=>{
  modal('<h3>'+esc(title)+'</h3><p class="muted">'+esc(msg)+'</p><div class="row"><button class="btn ghost grow" id="mc">Cancelar</button><button class="btn grow'+(danger?" danger":"")+'" id="mok">'+esc(ok||"Aceptar")+'</button></div>',()=>{
    $("#mc").onclick=()=>{mclose();res(false)};$("#mok").onclick=()=>{mclose();res(true)};
  })})}
function grpOpts(sel,blank){return (blank?'<option value="">'+esc(blank)+'</option>':"")+GR.map(g=>'<option'+(g===sel?" selected":"")+'>'+esc(g)+'</option>').join("")}
function exForm(ex,name){return new Promise(res=>{
  const nuevo=!ex;ex=ex||{n:name||"",g:"",g2:""};
  modal('<h3>'+(nuevo?"Nuevo ejercicio":"Editar ejercicio")+'</h3><div><label for="en">Nombre</label><input id="en" type="text" value="'+esc(ex.n)+'" autocomplete="off"></div><div><label for="eg">Grupo muscular principal</label><select id="eg">'+grpOpts(ex.g,"Sin grupo")+'</select></div><div><label for="eg2">Grupo secundario (opcional)</label><select id="eg2">'+grpOpts(ex.g2,"Ninguno")+'</select></div><div class="row"><button class="btn ghost grow" id="mc">Cancelar</button><button class="btn grow" id="mok">Guardar</button></div>',()=>{
    $("#mc").onclick=()=>{mclose();res(null)};
    $("#mok").onclick=()=>{
      const n=$("#en").value.trim();if(!n){toast("Escribe un nombre.",true);return}

function parseHours(v){
  v=String(v==null?"":v).trim().toLowerCase().replace(",",".");if(!v)return null;
  let m=v.match(/^(\d+):(\d{1,2})$/);if(m)return +m[1]+(+m[2])/60;
  m=v.match(/^(\d+(?:\.\d+)?)\s*(?:h|hr|hrs|hora|horas)\s*(?:y\s*)?(?:(\d+)\s*(?:m|min|mins|minuto|minutos)?)?$/);if(m)return +m[1]+(m[2]?+m[2]/60:0);
  m=v.match(/^(\d+(?:\.\d+)?)\s*(?:h|hora|horas)?\s*y\s*media$/);if(m)return +m[1]+.5;
  m=v.match(/^(\d+(?:\.\d+)?)\s*(?:m|min|mins|minuto|minutos)$/);if(m)return +m[1]/60;
  m=v.match(/^\d+(?:\.\d+)?$/);if(m){const n=+v;return n>12?n/60:n}
  return null;
}

function avgBuckets(grp,mode){
  const td=today(),first=S.sessions.length?S.sessions[0].f:td,tot={};
  const key=f=>mode==="anio"?f.slice(0,4):f.slice(0,7);
  S.sessions.forEach(se=>{const row={};se.ej.forEach(en=>countInto(row,en));
    const v=grp?(row[grp]||0):Object.values(row).reduce((x,y)=>x+y,0);tot[key(se.f)]=(tot[key(se.f)]||0)+v});
  const list=[];
  if(mode==="anio"){for(let y=+first.slice(0,4);y<=+td.slice(0,4);y++)list.push({k:String(y),s:y+"-01-01",e:y+"-12-31",l:String(y)})}

      h+='<div class="sess"><div class="row between sess-t"><b>'+esc(se.dia||"Entreno libre")+'</b><span class="row" style="gap:4px">'+(se.dur?'<span class="chip">⏱ '+fmtDur(se.dur)+'</span>':"")+'<span class="chip">'+se.ej.reduce((a,e)=>a+e.s.length,0)+' series</span></span></div>'+se.ej.map(en=>'<div class="small" style="margin-top:4px"><b>'+esc((S.catMap[en.e]||{n:"?"}).n)+'</b> <div class="sets-txt">'+en.s.map(setChip).join("")+'</div></div>').join("")+'</div>'});

/* ---------- SEGUIMIENTO Y EVOLUCIÓN ---------- */
const MKEYS=[["peso","Peso (kg)"],["cintura","Cintura (cm)"],["bizq","Brazo izq. (cm)"],["bder","Brazo der. (cm)"],["torso","Torso (cm)"],["hombros","Hombros (cm)"],["cuad","Cuádriceps (cm)"],["glut","Glúteos (cm)"]];
const sg=(v,d)=>v==null?"":(v>0?"+":"")+v.toFixed(d==null?1:d).replace(".",",");
const clsP=v=>v==null||v===0?"muted":v>0?"pos":"neg";
const clsC=v=>v==null||v===0?"muted":v>0?"neg":"pos";
const sdate=f=>f.slice(8)+"/"+f.slice(5,7)+"/"+f.slice(2,4);
function medRows(){
  const R=S.medidas.map(r=>Object.assign({},r)).sort((a,b)=>a.f<b.f?-1:a.f>b.f?1:0);
  const prev={peso:null,cintura:null};
  R.forEach(r=>{["peso","cintura"].forEach(k=>{
    if(r[k]==null){r["d_"+k]=null;r["p_"+k]=null;return}
    if(prev[k]==null){r["d_"+k]=null;r["p_"+k]=null}else{r["d_"+k]=r[k]-prev[k];r["p_"+k]=(r[k]-prev[k])/prev[k]*100}
    prev[k]=r[k]})});
  return R;
}
function medWr(){S.medPend=(S.medPend||0)+1;return wr("fuerza/medidas",{items:S.medidas}).finally(()=>{S.medPend--})}
function medKpis(R,per){
  const wr_=R.filter(r=>r.peso!=null),cs=R.filter(r=>r.cintura!=null),first=R[0],last=R[R.length-1];
  const dp=wr_.length>1?wr_[wr_.length-1].peso-wr_[0].peso:null,dc=cs.length>1?cs[cs.length-1].cintura-cs[0].cintura:null;
  const T=(b,l,c)=>'<div class="tile"><b'+(c?' class="'+c+'"':"")+'>'+b+'</b><span>'+l+'</span></div>';
  const pl=per==="all"?"":" de "+per;
  return '<div class="tiles">'+T(first?fdate(first.f):"–","Primera medición"+pl)+T(last?fdate(last.f):"–","Última medición"+pl)+
    T(wr_.length?fnum(wr_[0].peso)+" kg":"–","Peso inicial"+pl)+T(wr_.length?fnum(wr_[wr_.length-1].peso)+" kg":"–","Peso final"+pl)+
    T(dp==null?"–":sg(dp)+" kg","Cambio de peso"+(per==="all"?" total":" en "+per),dp==null?"":clsP(dp))+
    T(dc==null?"–":sg(dc)+" cm","Cambio de cintura"+(per==="all"?" total":" en "+per),dc==null?"":clsC(dc))+'</div>';
}
function medMonthly(R){
  const m={};R.forEach(r=>{const k=r.f.slice(0,7);const o=m[k]||(m[k]={p:[],c:[]});if(r.peso>0)o.p.push(r.peso);if(r.cintura>0)o.c.push(r.cintura)});
  const av=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  return Object.keys(m).sort().map(k=>({k:k,peso:av(m[k].p),cintura:av(m[k].c)}));
}
function dualChart(data,labels){
  const W=340,H=260,L=36,R=34,T=26,B=36,n=data.length;
  const vs=data.flatMap(r=>[r.peso,r.cintura]).filter(v=>v!=null);
  if(!vs.length)return '<div class="empty">Sin datos en este periodo.</div>';
  const mn=Math.min(...vs),mx=Math.max(...vs),st=mx-mn>16?5:2,lo=Math.floor(mn/st)*st-st,hi=Math.ceil(mx/st)*st+st;
  const X=i=>L+(n<=1?(W-L-R)/2:i/(n-1)*(W-L-R)),Y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Peso y cintura">';
  for(let v=lo;v<=hi;v+=st)s+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text x="'+(L-5)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+v+'</text>';
  const every=n>16?Math.ceil(n/7):1;
  labels.forEach((l,i)=>{if(i%every===0)s+='<text x="'+X(i).toFixed(1)+'" y="'+(H-12)+'" text-anchor="middle">'+esc(l)+'</text>'});
  const lab=(x,y,t,col,anc)=>'<text x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" text-anchor="'+(anc||"middle")+'" style="fill:'+col+';font-weight:700;font-size:10px;paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round">'+t+'</text>';
  const q={};["peso","cintura"].forEach(k=>q[k]=data.map((r,i)=>r[k]!=null?{i:i,x:X(i),y:Y(r[k]),v:r[k]}:null).filter(Boolean));
  const line=(k,col)=>{const p=q[k];if(!p.length)return "";
    return '<path d="'+p.map((o,i)=>(i?"L":"M")+o.x.toFixed(1)+" "+o.y.toFixed(1)).join(" ")+'" fill="none" stroke="'+col+'" stroke-width="2.4" stroke-linejoin="round"/>'+
      (p.length<=40?p.map(o=>'<circle cx="'+o.x.toFixed(1)+'" cy="'+o.y.toFixed(1)+'" r="3" fill="'+col+'"/>').join(""):"")};
  let labs="";
  if(n<=12){
    q.peso.forEach(o=>{const c=data[o.i].cintura;const up=c==null||o.v>c;labs+=lab(o.x,up?o.y-8:o.y+16,fnum(o.v),"var(--accent)")});
    q.cintura.forEach(o=>{const p=data[o.i].peso;const up=p==null||o.v>=p;labs+=lab(o.x,up?o.y-8:o.y+16,fnum(o.v),"#B8860B")});
  }else{
    const e=["peso","cintura"].map(k=>q[k].length?{k:k,o:q[k][q[k].length-1]}:null).filter(Boolean).sort((a,b)=>a.o.y-b.o.y);
    if(e.length===2&&e[1].o.y-e[0].o.y<13){e[0].ty=e[0].o.y-7;e[1].ty=e[1].o.y+11}
    e.forEach(z=>{labs+=lab(z.o.x+6,(z.ty==null?z.o.y+4:z.ty),fnum(z.o.v),z.k==="peso"?"var(--accent)":"#B8860B","start")});
  }
  return s+line("cintura","var(--brandy)")+line("peso","var(--accent)")+labs+'</svg>';
}

function scatterChart(rs,ks,m,front){

function xDate(v){
  if(v==null||v==="")return null;

  if(typeof v==="number")return iso(new Date(Math.round((v-25569)*864e5)));
  const s=String(v).trim();let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[1]+"-"+m[2]+"-"+m[3];
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m)return m[3]+"-"+pad(+m[2])+"-"+pad(+m[1]);return null;
}

    case "copy":{const i=+b.closest(".ex").id.slice(2),l=lastOf(D.e);if(l){S.draft.ej[i].s=l.s.map(s=>({p:s[0]?String(s[0]).replace(".",","):"",r:s[1]==null?"":String(s[1]),q:s[2]}));saveDraft();reEx(i);refreshCount()}break}
    case "rir":{const en=S.draft.ej[+D.i],s=en.s[+D.j],v=+D.v;s.q=s.q===v?null:v;saveDraft();
      b.parentNode.querySelectorAll("button").forEach(x=>{const v=+x.dataset.v,on=v===s.q;x.className=on?"on c"+(v<0?"f":v):""});break}
    case "addset":{const en=S.draft.ej[+D.i],l=en.s[en.s.length-1];en.s.push({p:l?l.p:"",r:"",q:null});saveDraft();reEx(+D.i);break}
    case "delset":{const en=S.draft.ej[+D.i];if(en.s.length>1)en.s.splice(+D.j,1);else en.s=[{p:"",r:"",q:null}];saveDraft();reEx(+D.i);refreshCount();break}
    case "delex":S.draft.ej.splice(+D.i,1);saveDraft();render();break;
    case "addex":{const id=await picker(S.draft.ej.map(x=>x.e));if(id){addExToDraft(id);saveDraft();render()}break}
    case "finish":finish();break;
    case "discard":if(await askOk("¿Descartar el entreno?","Se perderán las series que has apuntado.","Descartar",true)){S.draft=null;wr("fuerza/borrador",{d:null});render()}break;
    case "newrut":{const n=await askText("Nueva rutina","Nombre de la rutina","","Crear");if(n){const r={id:"r"+uid(),n:n,dias:[]};S.rut.push(r);S.openR[r.id]=true;saveRut();render()}break}
    case "toggler":S.openR[D.r]=!S.openR[D.r];render();break;
    case "renrut":{const r=R(),n=await askText("Renombrar rutina","Nombre",r.n);if(n){r.n=n;saveRut();render()}break}
    case "estrut":{const r=R();modal('<h3>Estado de la rutina</h3><div class="stack">'+ESTADOS.map(e=>'<button class="btn" data-a="setest" data-r="'+r.id+'" data-v="'+e[0]+'" style="text-align:left"><span class="chip '+e[2]+'">'+e[1]+'</span></button>').join("")+'<button class="btn ghost" data-a="setest" data-r="'+r.id+'" data-v="">Sin estado</button><button class="btn ghost" data-a="mclose">Cancelar</button></div>');break}
    case "setest":{const r=R();if(D.v)r.est=D.v;else delete r.est;mclose();saveRut();render();break}
    case "duprut":{const r=R(),c=JSON.parse(JSON.stringify(r));c.id="r"+uid();c.n=r.n+" (copia)";c.dias.forEach(d=>d.id="d"+uid());S.rut.push(c);S.openR[c.id]=true;saveRut();render();break}
    case "delrut":if(await askOk("Eliminar rutina","Se borra la rutina y sus días. Tu historial de series no se toca.","Eliminar",true)){S.rut=S.rut.filter(x=>x.id!==D.r);if(S.pick.r===D.r)S.pick={r:"",d:"",date:""};saveRut();render()}break;
    case "adddia":{const r=R(),n=await askText("Nuevo día","Nombre del día",""+"Día "+(r.dias.length+1),"Añadir");if(n){r.dias.push({id:"d"+uid(),n:n,ej:[]});saveRut();render()}break}
    case "rendia":{const d=Dia(),n=await askText("Renombrar día","Nombre",d.n);if(n){d.n=n;saveRut();render()}break}
    case "deldia":if(await askOk("Eliminar día","Se quita este día de la rutina.","Eliminar",true)){const r=R();r.dias=r.dias.filter(x=>x.id!==D.d);if(S.pick.d===D.d)S.pick.d="";saveRut();render()}break;
    case "mvdia":{const r=R(),i=r.dias.findIndex(x=>x.id===D.d);if(mv(r.dias,i,+D.v)){saveRut();render()}break}
    case "addroutex":{const d=Dia(),id=await picker(d.ej);if(id){d.ej.push(id);saveRut();render()}break}
    case "mvex":{const d=Dia();if(mv(d.ej,+D.i,+D.v)){saveRut();render()}break}
    case "rmex":{const d=Dia();d.ej.splice(+D.i,1);saveRut();render();break}
    case "togglecat":S.showCat=!S.showCat;render();break;
    case "newex":{const o=await exForm(null,S.catQ);if(o){S.cat.push(o);rebuild();saveCat();render()}break}
    case "editex":{const c=S.catMap[D.e],o=await exForm(c);if(o){Object.assign(c,o);saveCat();render()}break}
    case "sec":S.cfg.sec=D.v;saveCfg();render();break;
    case "weeks":S.weeks=+D.v;render();break;
    case "progall":S.progAll=!S.progAll;render();break;
    case "chstart":S.draft.t0=Date.now();S.draft.t1=null;saveDraft();render();break;
    case "chstop":S.draft.t1=Date.now();saveDraft();render();break;
    case "chreset":S.draft.t0=null;S.draft.t1=null;saveDraft();render();break;
    case "calview":S.calView=D.v;render();break;
    case "sview":S.sView=D.v;render();break;
    case "smode":S.sMode=D.v;render();break;
    case "gmet":S.gMet=D.v;render();break;
    case "gtype":S.gType=D.v;render();break;
    case "padelh":{S.padel.h=D.v;const i=$("#ph");if(i)i.value=D.v;render();break}
    case "padelsave":savePadel();break;
    case "padelday":S.padel.date=D.d;S.saved=null;S.tab="entrenar";render();window.scrollTo(0,0);break;
    case "delpadel":{if(!await askOk("Eliminar pádel","Se borra este registro de pádel.","Eliminar",true))break;
      S.padelList=S.padelList.filter(x=>x.id!==D.id);
      const se=S.sessions.find(x=>x.id===D.id);if(se){const k=se.f.slice(0,4),doc=S.hist[k];if(doc)doc.ses=doc.ses.filter(x=>x.id!==D.id)}
      rebuild();padelWr().then(ok=>{if(ok)toast("Pádel eliminado")});render();break}
    case "gmode":S.gMode=D.v;render();break;
    case "calnav":{const c=S.calMonth||today().slice(0,7);let y=+c.slice(0,4),m=+c.slice(5,7)+(+D.v);if(m<1){m=12;y--}if(m>12){m=1;y++}S.calMonth=y+"-"+pad(m);S.calSel=null;render();break}
    case "calsel":S.calSel=S.calSel===D.d?null:D.d;render();break;
    case "cmode":S.chartMode=D.v;render();break;
    case "topall":S.topAll=!S.topAll;render();break;
    case "delhist":{if(!await askOk("Eliminar esta sesión","Se borra solo este ejercicio de ese día.","Eliminar",true))break;
      const se=S.sessions.find(x=>x.id===D.id);if(!se)break;se.ej=se.ej.filter(x=>x.e!==D.e);const k=se.f.slice(0,4);const doc=S.hist[k];
      doc.ses=doc.ses.filter(x=>x.tipo==="padel"||x.ej.length>0);rebuild();putMonth(k);render();break}
    case "xlsx":doXlsx();break;
    case "csv":doCsv();break;
    case "seed":doSeed();break;
  }
});
document.addEventListener("input",e=>{
  const t=e.target,f=t.dataset&&t.dataset.f;if(!f)return;
  if(f==="p"||f==="r"){const s=S.draft.ej[+t.dataset.i].s[+t.dataset.j];s[f]=t.value;saveDraft();if(f==="r")refreshCount()}
  else if(f==="n"){S.draft.ej[+t.dataset.i].n=t.value;saveDraft()}
  else if(f.indexOf("mf-")===0){S.mf[f.slice(3)]=t.value}
  else if(f==="padel-h"){S.padel.h=t.value;const pv=$("#phv");if(pv)pv.textContent=padelPrev(t.value)}
  else if(f==="catq"){S.catQ=t.value;$("#catlist").innerHTML=catList()}
});
document.addEventListener("change",e=>{
  const t=e.target,f=t.dataset&&t.dataset.f;if(!f)return;
  if(f==="pick-r"){S.pick.r=t.value;S.pick.d="";render()}
  else if(f==="pick-d"){S.pick.d=t.value;render()}
  else if(f==="pick-date"){S.pick.date=t.value}
  else if(f==="padel-date"){S.padel.date=t.value}
  else if(f==="sgrp"){S.sGrp=t.value;render()}
  else if(f==="progex"){S.progEx=t.value;render()}
  else if(f==="import"){doImport(t.files&&t.files[0]);t.value=""}
});

document.addEventListener("filesaved",()=>toast("Copia guardada en tu Drive, carpeta «GraFit»."));
/* ---------- arranque ---------- */
(async function(){
  render();
  let db=null;try{db=await claude.use("db")}catch(e){}
  if(!db){S.err="nodb";render();return}
  S.db=db;
  const bad=()=>{S.loaded.err=true};
  const lt=setTimeout(()=>{if(!(S.loaded.cat&&S.loaded.hist&&S.loaded.rut)){const a=$("#app");a.insertAdjacentHTML("afterbegin",'<div class="banner warn">Tus datos tardan en llegar. Puede que lo que ves no esté al día.</div>')}},10000);
  db.doc("fuerza/catalogo").onSnapshot(s=>{S.cat=s.exists?(s.data().items||[]):[];S.loaded.cat=true;rebuild();soft()},bad);
  db.doc("fuerza/padel").onSnapshot(s=>{if(S.padelPend>0)return;S.padelList=s.exists?(s.data().items||[]):[];S.loaded.pd=true;rebuild();soft()},bad);
  db.doc("fuerza/medidas").onSnapshot(s=>{if(S.medPend>0)return;S.medidas=s.exists?(s.data().items||[]):[];S.medidas.forEach((r,i)=>{if(!r.id)r.id="m"+i+r.f});S.loaded.med=true;soft()},bad);
  db.doc("fuerza/rutinas").onSnapshot(s=>{S.rut=s.exists?(s.data().items||[]):[];S.loaded.rut=true;soft()},bad);
  db.doc("fuerza/config").onSnapshot(s=>{if(s.exists)S.cfg=Object.assign({sec:"principal",copia:null},s.data());S.loaded.cfg=true;soft()},bad);
  db.doc("fuerza/borrador").onSnapshot(s=>{if(!S.draftReady){S.draftReady=true;const d=s.exists?s.data().d:null;if(d)S.draft=d;S.loaded.dr=true;render()}},bad);
  db.collection("hist").onSnapshot(q=>{const h={};q.docs.forEach(d=>h[d.id]=decDoc(d.data()));S.hist=h;S.loaded.hist=true;rebuild();soft();clearTimeout(lt)},bad);
})();
</script>
